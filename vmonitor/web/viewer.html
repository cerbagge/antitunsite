<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · VMonitor</title>
<style>
  :root {
    --bg: #0b0f17; --panel: #121826; --line: #243042; --text: #e5e7eb; --muted: #94a3b8;
    --accent: #38bdf8; --ok: #34d399; --warn: #fbbf24; --bad: #f87171;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 14px;
    background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0 6px 0 0; font-weight: 600; }
  .pill { padding: 2px 8px; border-radius: 6px; background: #1e293b; color: var(--muted); font-size: 12px; }
  .pill.ok { color: var(--ok); } .pill.bad { color: var(--bad); }
  label.tg { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; user-select: none; }
  button, input[type=text] { font: inherit; color: var(--text); background: #1e293b; border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 10px; }
  button:hover { border-color: var(--accent); cursor: pointer; }
  main { display: flex; height: calc(100% - 50px); min-height: 0; }
  #stage { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; outline: none;
    position: relative; min-width: 0; }
  #stage.control { box-shadow: inset 0 0 0 2px var(--accent); }
  #screen { max-width: 100%; max-height: 100%; display: block; user-select: none; -webkit-user-drag: none;
    image-rendering: auto; background: #000; }
  #stage.control #screen { cursor: crosshair; }
  #stage.inspect #screen { cursor: cell; }
  aside { width: 300px; border-left: 1px solid var(--line); background: var(--panel); padding: 12px;
    overflow: auto; display: flex; flex-direction: column; gap: 14px; }
  aside h2 { font-size: 13px; margin: 0 0 6px; color: var(--muted); font-weight: 600; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  #picks { font: 12px ui-monospace, Menlo, Consolas, monospace; display: flex; flex-direction: column; gap: 4px; }
  #picks div { display: flex; gap: 6px; align-items: center; }
  .sw { width: 14px; height: 14px; border-radius: 3px; border: 1px solid #0006; flex: none; }
  #log { font: 12px ui-monospace, Menlo, Consolas, monospace; color: var(--muted); white-space: pre-wrap; }
  #hint { position: absolute; left: 10px; bottom: 10px; font-size: 12px; color: var(--muted);
    background: #000a; padding: 3px 8px; border-radius: 6px; pointer-events: none; }
  @media (max-width: 800px) { aside { display: none; } }
</style>
</head>
<body>
<header>
  <h1>{{TITLE}}</h1>
  <span id="conn" class="pill">연결 중…</span>
  <span id="size" class="pill">-</span>
  <span id="pos" class="pill">x -, y -</span>
  <label class="tg"><input type="checkbox" id="ctl"> 조작 허용</label>
  <label class="tg"><input type="checkbox" id="insp"> 좌표 확인</label>
  <label class="tg"><input type="checkbox" id="grid"> 격자</label>
  <button id="shot" title="현재 화면 PNG 저장">스크린샷</button>
</header>
<main>
  <div id="stage" tabindex="0">
    <img id="screen" alt="송출 화면" draggable="false">
    <div id="hint">조작 허용을 켜면 이 화면에서 마우스·키보드가 대상에 그대로 전달됩니다</div>
  </div>
  <aside>
    <section>
      <h2>텍스트 보내기 (한글 등)</h2>
      <div class="row"><input type="text" id="txt" placeholder="입력할 문장" style="flex:1;min-width:0">
        <button id="send">입력</button></div>
    </section>
    <section>
      <h2>자주 쓰는 키</h2>
      <div class="row" id="keys"></div>
    </section>
    <section>
      <h2>좌표 확인 (클릭한 지점)</h2>
      <div id="picks"><span style="color:var(--muted)">‘좌표 확인’을 켜고 화면을 클릭하세요</span></div>
    </section>
    <section>
      <h2>로그</h2>
      <div id="log"></div>
    </section>
  </aside>
</main>
<script>
(() => {
  const qs = new URLSearchParams(location.search);
  const token = qs.get("token") || "";
  const tq = token ? "token=" + encodeURIComponent(token) : "";
  const $ = (id) => document.getElementById(id);
  const img = $("screen"), stage = $("stage");
  const headers = token ? { Authorization: "Bearer " + token } : {};

  function log(msg) {
    const el = $("log");
    el.textContent = (new Date().toLocaleTimeString() + " " + msg + "\n" + el.textContent).slice(0, 4000);
  }

  // ---------------------------------------------------------------- 영상
  function setStream() {
    const p = new URLSearchParams();
    if (token) p.set("token", token);
    if ($("grid").checked) p.set("grid", "100");
    p.set("t", Date.now());
    img.src = "/stream.mjpg?" + p.toString();
  }
  img.addEventListener("error", () => { $("conn").textContent = "영상 끊김 - 재연결"; $("conn").className = "pill bad";
    setTimeout(setStream, 1500); });
  $("grid").addEventListener("change", setStream);

  async function refreshInfo() {
    try {
      const r = await fetch("/api/info", { headers });
      if (!r.ok) throw new Error(r.status);
      const i = await r.json();
      $("size").textContent = `${i.backend} · ${i.size[0]}×${i.size[1]}` + (i.read_only ? " · 읽기전용" : "");
      if (i.last_error) { $("conn").textContent = "오류: " + i.last_error; $("conn").className = "pill bad"; }
      else if (ws && ws.readyState === 1) { $("conn").textContent = "연결됨"; $("conn").className = "pill ok"; }
    } catch (e) { $("conn").textContent = "서버 응답 없음"; $("conn").className = "pill bad"; }
  }

  // ---------------------------------------------------------------- 입력 전송 (WebSocket)
  let ws = null, nextId = 1;
  function connect() {
    ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws" + (tq ? "?" + tq : ""));
    ws.onopen = () => { $("conn").textContent = "연결됨"; $("conn").className = "pill ok"; };
    ws.onclose = () => { $("conn").textContent = "제어 연결 끊김"; $("conn").className = "pill bad"; setTimeout(connect, 1500); };
    ws.onmessage = (ev) => {
      if (typeof ev.data !== "string") return;
      const m = JSON.parse(ev.data);
      if (!m.ok) log("실패: " + (m.error || (m.results || []).filter(r => !r.ok).map(r => r.error).join(", ")));
    };
  }
  function send(actions) {
    if (!ws || ws.readyState !== 1) return;
    ws.send(JSON.stringify({ id: nextId++, actions: Array.isArray(actions) ? actions : [actions] }));
  }

  // 화면 좌표 → 대상 픽셀 좌표
  function toFrame(e) {
    const r = img.getBoundingClientRect();
    const w = img.naturalWidth || r.width, h = img.naturalHeight || r.height;
    const x = Math.round((e.clientX - r.left) * w / r.width);
    const y = Math.round((e.clientY - r.top) * h / r.height);
    return { x: Math.max(0, Math.min(w - 1, x)), y: Math.max(0, Math.min(h - 1, y)) };
  }
  const BTN = ["left", "middle", "right"];
  const control = () => $("ctl").checked && !$("insp").checked;

  $("ctl").addEventListener("change", () => {
    stage.classList.toggle("control", $("ctl").checked);
    if ($("ctl").checked) stage.focus(); else releaseKeys();
  });
  $("insp").addEventListener("change", () => stage.classList.toggle("inspect", $("insp").checked));

  let lastMove = 0, pendingMove = null;
  img.addEventListener("mousemove", (e) => {
    const p = toFrame(e);
    $("pos").textContent = `x ${p.x}, y ${p.y}`;
    if (!control()) return;
    pendingMove = p;
    const now = performance.now();
    if (now - lastMove > 33) { lastMove = now; send({ action: "move", x: p.x, y: p.y }); pendingMove = null; }
  });
  img.addEventListener("mousedown", async (e) => {
    e.preventDefault();
    stage.focus();
    const p = toFrame(e);
    if ($("insp").checked) { pick(p); return; }
    if (!control()) return;
    const b = BTN[e.button] || "left";
    pressed.add(b);
    send([{ action: "move", x: p.x, y: p.y }, { action: "mouse_down", button: b, count: e.detail || 1 }]);
  });
  const pressed = new Set();
  window.addEventListener("mouseup", (e) => {
    const b = BTN[e.button] || "left";
    if (!pressed.has(b)) return;  // 뷰어 화면에서 시작한 누름만 떼기
    pressed.delete(b);
    const p = pendingMove;
    const acts = [];
    if (p) { acts.push({ action: "move", x: p.x, y: p.y }); pendingMove = null; }
    acts.push({ action: "mouse_up", button: b, count: e.detail || 1 });
    send(acts);
  });
  img.addEventListener("contextmenu", (e) => e.preventDefault());
  img.addEventListener("wheel", (e) => {
    if (!control()) return;
    e.preventDefault();
    const p = toFrame(e);
    const unit = e.deltaMode === 1 ? 1 / 3 : 1 / 100;  // 줄 단위 / 픽셀 단위
    const n = (d) => d === 0 ? 0 : Math.sign(d) * Math.max(1, Math.round(Math.abs(d) * unit));
    const dx = n(e.deltaX), dy = n(e.deltaY);
    if (dx || dy) send({ action: "scroll", x: p.x, y: p.y, dx, dy });
  }, { passive: false });

  // ---------------------------------------------------------------- 키보드
  const CODE = { Minus: "-", Equal: "=", BracketLeft: "[", BracketRight: "]", Backslash: "\\", Semicolon: ";",
    Quote: "'", Backquote: "`", Comma: ",", Period: ".", Slash: "/", Space: "space", IntlBackslash: "\\" };
  const KEY = { Enter: "enter", Escape: "esc", Tab: "tab", Backspace: "backspace", Delete: "delete", Insert: "insert",
    Home: "home", End: "end", PageUp: "pageup", PageDown: "pagedown", ArrowUp: "up", ArrowDown: "down",
    ArrowLeft: "left", ArrowRight: "right", Shift: "shift", Control: "ctrl", Alt: "alt", Meta: "meta", OS: "meta",
    CapsLock: "capslock", ContextMenu: "contextmenu", HangulMode: "hangul", HanjaMode: "hanja", Pause: "pause",
    PrintScreen: "printscreen", NumLock: "numlock", ScrollLock: "scrolllock" };
  function canon(e) {
    if (/^Key[A-Z]$/.test(e.code)) return e.code.slice(3).toLowerCase();
    if (/^Digit[0-9]$/.test(e.code)) return e.code.slice(5);
    if (/^Numpad[0-9]$/.test(e.code)) return e.code.slice(6);
    if (/^F([1-9]|1[0-9]|2[0-4])$/.test(e.key)) return e.key.toLowerCase();
    if (KEY[e.key]) return KEY[e.key];
    if (CODE[e.code]) return CODE[e.code];
    return e.key && e.key.length === 1 ? e.key : null;
  }
  const held = new Set();
  function releaseKeys() { const acts = [...held].map(k => ({ action: "key_up", key: k })); held.clear(); if (acts.length) send(acts); }
  stage.addEventListener("keydown", (e) => {
    if (!control() || e.isComposing || e.keyCode === 229) return;
    const k = canon(e);
    if (!k) return;
    e.preventDefault();
    if (held.has(k) && ["shift", "ctrl", "alt", "meta"].includes(k)) return;
    held.add(k);
    send({ action: "key_down", key: k });
  });
  stage.addEventListener("keyup", (e) => {
    if (!control()) return;
    const k = canon(e);
    if (!k || !held.has(k)) return;
    e.preventDefault();
    held.delete(k);
    send({ action: "key_up", key: k });
  });
  stage.addEventListener("blur", releaseKeys);

  // ---------------------------------------------------------------- 사이드 패널
  $("send").addEventListener("click", () => { const t = $("txt").value; if (t) { send({ action: "type", text: t }); $("txt").value = ""; } });
  $("txt").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing) $("send").click(); });
  for (const k of ["enter", "esc", "tab", "backspace", "ctrl+a", "ctrl+c", "ctrl+v", "ctrl+z", "alt+tab", "f5"]) {
    const b = document.createElement("button");
    b.textContent = k;
    b.addEventListener("click", () => send({ action: "key", keys: k }));
    $("keys").appendChild(b);
  }
  async function pick(p) {
    let color = null;
    try {
      const r = await fetch(`/api/pixel?x=${p.x}&y=${p.y}`, { headers });
      if (r.ok) color = (await r.json()).hex;
    } catch (_) {}
    const box = $("picks");
    if (box.firstElementChild && box.firstElementChild.tagName === "SPAN") box.innerHTML = "";
    const row = document.createElement("div");
    const sw = document.createElement("span"); sw.className = "sw"; sw.style.background = color || "transparent";
    const snippet = `{"action":"click","x":${p.x},"y":${p.y}}`;
    const t = document.createElement("span"); t.textContent = `(${p.x}, ${p.y}) ${color || ""}`;
    const cp = document.createElement("button"); cp.textContent = "복사"; cp.title = snippet;
    cp.addEventListener("click", () => navigator.clipboard && navigator.clipboard.writeText(snippet));
    row.append(sw, t, cp);
    box.prepend(row);
  }
  $("shot").addEventListener("click", async () => {
    const r = await fetch("/api/screenshot?format=png", { headers });
    if (!r.ok) { log("스크린샷 실패 " + r.status); return; }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(await r.blob());
    a.download = "vmonitor-" + new Date().toISOString().replace(/[:.]/g, "-") + ".png";
    a.click();
  });

  setStream();
  connect();
  refreshInfo();
  setInterval(refreshInfo, 3000);
})();
</script>
</body>
</html>
